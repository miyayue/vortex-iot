<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Monitoramento de Ambiente</title>

    <link href="styles.css" rel="stylesheet">

    <link href="http://fonts.googleapis.com/css?family=Ubuntu:400,700" rel="stylesheet" type="text/css" />
</head>

<body>
    <header>
        <h1>Monitoramento de Ambiente</h1>
    </header>

    <div id="configs">
        <div>
            <label for="device-select">Exibir medidas do dispositivo:</label>
            <select name="devices" id="device-select">
                <option>Todos</option>
            </select>
        </div>

        <div>
            <label>Quantidade de medidas: </label>
            <span id="measurements_count"> - </span>
        </div>
    </div>

    <div id="measurements"></div>
    <script src="script.js"></script>
</body>

</html>
